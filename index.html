<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#0F5A8E">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="media/favicon.png">
<link rel="apple-touch-icon" href="media/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="دليل المختبرات">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>دليل المختبرات</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: phone-first app in the field-rounds visual language — blue gradient header, pale-blue ground, white cards, 3-tab bottom bar */
:root{
  --bg:#F2F7FB; --card:#FFFFFF; --ink:#15293A; --muted:#4B5E6D; --line:#D9E4EC; --line-2:#C5D4DF;
  --brand:#0F5A8E; --brand-2:#1677B5; --brand-soft:#E4F1FA; --teal:#0E7468; --teal-soft:#E1F3F0;
  --warn:#A3311F; --warn-soft:#FBEAE6; --amber:#9A5B07; --amber-soft:#FCF1DF; --on-brand:#FFFFFF;
  --f:"Cairo","Segoe UI",Tahoma,sans-serif; color-scheme:only light;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
.ltr{direction:ltr;unicode-bidi:isolate;white-space:nowrap;display:inline-block;color:inherit!important;font-size:inherit!important;font-weight:inherit!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.65;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#0F5A8E}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid #1692D1;outline-offset:2px}

.app{max-width:640px;margin:0 auto;min-height:100%;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:linear-gradient(135deg,#0F5A8E 0%,#1677B5 100%);color:#fff;
  padding:14px max(18px,env(safe-area-inset-right,0px)) 14px max(18px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px;border-radius:0 0 18px 18px}
.top .back{border:0;background:rgba(255,255,255,.16);color:#fff;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.wlogo{width:64px;height:64px;object-fit:contain;display:block}
.badge{width:68px;height:68px;border-radius:50%;background:#FFFFFF;display:grid;place-items:center;box-shadow:0 4px 14px rgba(5,40,70,.25);flex:none}
.badge img{width:52px;height:52px;object-fit:contain}
.top.center{justify-content:center;padding-block:14px 16px}
.brandhead{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;line-height:1.35;min-width:0}
.brandhead small{font-size:12px;opacity:.9}
.brandhead b{font-size:18px;font-weight:700;text-wrap:balance}
.top .mark{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}
.top .tt{display:flex;flex-direction:column;line-height:1.35;min-width:0;flex:1}
.card.install{gap:12px;margin-top:8px;background:linear-gradient(135deg,#0F5A8E 0%,#1677B5 100%);border:0;color:#fff}
.ins-row{display:flex;gap:12px;align-items:center}
.ins-ic{width:44px;height:44px;object-fit:contain;flex:none}
.ins-tx{display:flex;flex-direction:column;line-height:1.45}
.ins-tx b{font-size:16px}
.ins-tx span{font-size:13px;opacity:.9}
.ins-btn{border:0;border-radius:10px;height:46px;background:#fff;color:#0F5A8E;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.ssticky{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:4;background:var(--bg);padding:6px 0 8px;display:flex;flex-direction:column;gap:8px}
.schips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.schips::-webkit-scrollbar{display:none}
.schips button{flex:none;height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line-2);background:var(--card);font-size:13.5px;font-weight:600;color:var(--ink)}
.schips button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.scols{display:flex;gap:3px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.scols::-webkit-scrollbar{display:none}
.scols button{flex:none}
.scols button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line-2);background:var(--card);display:grid;place-items:center;padding:0}
.scols button i{width:17px;height:17px;border-radius:50%;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.scols button[aria-pressed="true"]{border:2px solid var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.scount{margin:0;font-size:13px;color:var(--muted);font-weight:600}
.slist{display:flex;flex-direction:column;gap:10px}
.sup{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.sup img{width:60px;height:60px;flex:none;border-radius:10px;background:#fff;border:1px solid var(--line)}
.sx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.sx>b{font-size:15.5px;line-height:1.5}
.sen{direction:ltr;text-align:right;font-size:11.5px;color:var(--muted);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sgl{font-size:13px;font-weight:700;color:var(--muted);margin:8px 2px 0}
.scs{display:flex;flex-direction:column;gap:5px;margin-top:4px}
.scp{display:flex;align-items:center;gap:8px;width:100%;min-height:38px;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:4px 10px;font:inherit;color:var(--ink);text-align:start}
.scp>span{font-size:11px;font-weight:700;color:var(--brand);width:62px;flex:none;direction:ltr;text-align:right}
.scp b{flex:1;direction:ltr;text-align:right;font-size:15px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.scp svg{color:var(--brand);flex:none}
.scp.none b{color:var(--muted);font-size:13px;font-weight:600}
.scp:active{background:var(--brand-soft)}
.str{margin-top:4px;font-size:13px}
.str summary{cursor:pointer;font-weight:700;color:var(--brand);padding:4px 0}
.trr{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.trr small{direction:ltr;text-align:right;color:var(--muted);font-size:11px}
.snote{margin:4px 0 0;display:flex;gap:6px;align-items:flex-start;font-size:12.5px;color:var(--amber);background:var(--amber-soft);border-radius:8px;padding:6px 8px}
.snote svg{flex:none;margin-top:2px}
.credit-by{margin:22px 0 4px;text-align:center;font-size:13.5px;color:var(--muted)}
.credit-by b{color:var(--brand);font-weight:700}
.credit-by small{display:block;font-size:12.5px;margin-top:2px}
.top .minilogo{width:46px;height:46px;object-fit:contain;flex:none;display:block}
.top .tt small{font-size:12px;opacity:.9}
.top .tt b{font-size:16px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.page{padding:20px max(18px,env(safe-area-inset-right,0px)) 8px max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-size:23px;font-weight:700;color:var(--brand);line-height:1.35;text-wrap:balance}
.sub{margin:-8px 0 0;color:var(--muted);font-size:14px}
h3{margin:0;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}

/* search */
.search{position:relative;display:block}
.search svg{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{width:100%;height:50px;border:1px solid var(--line-2);border-radius:12px;background:var(--card);font-size:16px;padding:0 44px 0 14px}

/* guide list */
.group{display:flex;flex-direction:column;gap:8px}
.glabel{font-size:13px;font-weight:600;color:var(--muted);padding-inline:4px}
.row{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;min-height:68px}
.row:focus-visible{outline:2px solid #1692D1;outline-offset:2px}
.row .ic{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--brand-soft);color:var(--brand)}
.row .ic.t{background:var(--teal-soft);color:var(--teal)}
.row .ic.w{background:var(--warn-soft);color:var(--warn)}
.row .ic.a{background:var(--amber-soft);color:var(--amber)}
.row .tx{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.45}
.row .tx b{font-size:15px}
.row .tx span{font-size:13px;color:var(--muted)}
.row .chev{color:var(--muted);flex:none}
.empty{padding:28px 16px;text-align:center;color:var(--muted);background:var(--card);border:1px dashed var(--line-2);border-radius:12px}

/* guide detail */
.hero{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;gap:14px;align-items:flex-start}
.hero .ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--brand-soft);color:var(--brand)}
.hero p{margin:0;font-size:14.5px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.steps > li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.steps > li:first-child{border-top:0;padding-top:2px}
.num{width:34px;height:34px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.steps b{display:block;font-size:15px;line-height:1.45}
.steps p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.steps ul{margin:4px 0 0;padding:0 18px 0 0;font-size:14px;color:var(--muted);list-style:disc}
.steps ul li{padding:1px 0}
.ticks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ticks li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;align-items:start;font-size:14.5px}
.ticks .b{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;margin-top:1px}
.ticks.ok .b,.ticks li.ok .b{background:var(--teal-soft);color:var(--teal)}
.ticks.no .b,.ticks li.no .b{background:var(--warn-soft);color:var(--warn)}
.ticks.info .b{background:var(--brand-soft);color:var(--brand)}
.card.warn{border-color:transparent;background:var(--warn-soft)}
.card.warn h3{color:var(--warn)}
.card.ok h3{color:var(--teal)}
.doc{gap:12px}
.doc-th{display:block;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;max-height:240px}
.doc-th img{display:block;width:100%;height:auto}
.doc-tx{display:flex;flex-direction:column;gap:6px}
.doc-tx h3{margin:0;font-size:17px;color:var(--brand)}
.doc-tx p{margin:0;font-size:14px}
.doc-en{direction:ltr;text-align:right;color:var(--muted);font-size:13px!important}
.doc-tag{align-self:flex-start;font-size:12px;font-weight:700;color:var(--brand);background:var(--brand-soft);border-radius:999px;padding:2px 10px}
.doc-notes{background:var(--brand-soft);border-radius:10px;padding:10px 12px;margin-top:4px}
.doc-notes b{display:flex;align-items:center;gap:6px;color:var(--brand);font-size:14px}
.doc-notes ul{margin:6px 0 0;padding-inline-start:20px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.doc-btns{display:flex;gap:8px;margin-top:6px}
.doc-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:44px;border-radius:10px;background:var(--brand);color:#fff;text-decoration:none;font-weight:700;font-size:14.5px}
.doc-btn.alt{background:var(--card);color:var(--brand);border:1px solid var(--line-2)}
.callout{display:flex;gap:10px;align-items:flex-start;background:var(--amber-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:14px}
.callout svg{color:var(--amber);flex:none;margin-top:2px}
.credit{font-size:12.5px;color:var(--muted);text-align:center}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{background:var(--warn-soft);color:var(--warn);font-weight:700;border-radius:999px;padding:4px 12px;font-size:13.5px;direction:ltr}
.ref{width:100%;border-collapse:collapse;font-size:14px}
.ref th,.ref td{padding:10px 6px;border-bottom:1px solid var(--line);text-align:start;vertical-align:middle}
.ref th{font-size:12.5px;color:var(--muted);font-weight:600}
.ref td.n{direction:ltr;text-align:left;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.ref td small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:6px;vertical-align:middle}
.tw{overflow-x:auto}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.legend > div{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:13.5px}
.legend b{display:block;font-size:14px}

/* afinion */
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.seg button{flex:none;border:1px solid var(--line-2);background:var(--card);border-radius:999px;padding:0 14px;height:42px;font-size:14px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kv > div{background:var(--bg);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kv span{font-size:12.5px;color:var(--muted)}
.kv b{font-size:15px;line-height:1.4}
.kv .wide{grid-column:1 / -1}
.code{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:10px;padding:8px 8px 8px 12px}
.code .l{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.4}
.code .l span{font-size:12.5px;color:var(--muted)}
.code .l b{font-size:16px;direction:ltr;text-align:right;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.copy{border:1px solid var(--line-2);background:var(--card);border-radius:10px;height:40px;padding:0 12px;font-size:13px;font-weight:600;color:var(--brand);flex:none}
.err{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.err:first-child{border-top:0;padding-top:0}
.err .c{background:var(--brand-soft);color:var(--brand);border-radius:10px;height:40px;display:grid;place-items:center;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;direction:ltr}
.err .c.long{font-size:11px;line-height:1.2;text-align:center;padding:2px}
.err b{display:block;font-size:14.5px;line-height:1.45}
.err p{margin:3px 0 0;font-size:13.5px;color:var(--muted)}
.err p + p{margin-top:6px}
.err .why{color:var(--ink);font-weight:600}
.repeat{display:inline-block;background:var(--teal-soft);color:var(--teal);font-size:12px;font-weight:600;border-radius:6px;padding:1px 8px;margin-top:4px}

/* converter */
.pair{display:grid;grid-template-columns:minmax(0,1fr) 44px minmax(0,1fr);gap:8px;align-items:end}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld label{font-size:13px;font-weight:600;color:var(--muted);text-align:center}
.fld input{height:58px;border:1px solid var(--line-2);border-radius:12px;background:var(--card);text-align:center;font-size:24px;font-weight:700;direction:ltr;font-variant-numeric:tabular-nums;width:100%}
.res{height:58px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-size:24px;font-weight:700;direction:ltr;font-variant-numeric:tabular-nums}
.dirseg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.dirseg button{height:48px;padding:0 8px;font-size:13.5px}
.eq{height:58px;display:grid;place-items:center;color:var(--muted);font-weight:700}
.status{border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.status.in{background:var(--teal-soft);color:var(--teal)}
.status.hi{background:var(--warn-soft);color:var(--warn)}
.status.lo{background:var(--amber-soft);color:var(--amber)}
.status.none{background:var(--bg);color:var(--muted);font-weight:500}

/* bottom bar */
.nav{position:fixed;inset:auto 0 0 0;z-index:8;background:var(--card);border-top:1px solid var(--line);padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.nav .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tab{border:0;background:none;height:62px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:12.5px;font-weight:600}
.tab .p{width:56px;height:30px;border-radius:999px;display:grid;place-items:center}
.tab[aria-current="page"]{color:var(--brand)}
.tab[aria-current="page"] .p{background:var(--brand-soft)}
.pair2{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.art{position:relative;background:#FFFFFF;border-bottom:1px solid var(--line)}
.art svg{display:block;width:100%;height:auto;max-width:100%}
.cz{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;align-items:start;border-radius:10px;padding:8px 10px;margin-top:8px}
.cz.bad{background:var(--warn-soft)}
.cz.ok{background:var(--teal-soft)}
.cz .b{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:#fff;margin-top:2px}
.cz.bad .b{background:#C2412C}
.cz.ok .b{background:#0E8A7E}
.cz .lab{font-size:12px;font-weight:700}
.cz.bad .lab{color:var(--warn)}
.cz.ok .lab{color:var(--teal)}
.cz p{margin:0;font-size:14.5px;color:var(--ink)}
.staffnote{display:flex;gap:10px;align-items:center;background:var(--brand-soft);color:var(--brand);border:1px solid var(--line-2);border-radius:12px;padding:12px 14px;font-size:15px;font-weight:600}
.staffnote svg{flex:none}
.courier{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#0F5A8E 0%,#1677B5 100%);color:#fff;border-radius:14px;padding:16px}
.courier .cl{width:92px;height:72px;border-radius:14px;background:#fff;color:#0F5A8E;display:grid;place-items:center;flex:none;overflow:hidden}
.courier .cl img{width:80px;height:60px;object-fit:contain}
.courier .ct{display:flex;flex-direction:column;gap:2px;min-width:0}
.courier .ct span{font-size:12.5px;opacity:.9}
.courier .ct b{font-size:17px}
.courier .ct p{margin:2px 0 0;font-size:14px;opacity:.95}
.refc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.refc .rh{display:flex;align-items:center;gap:12px}
.refc .rh img{width:58px;height:58px;border-radius:50%;object-fit:cover;background:#fff;border:1px solid var(--line);flex:none}
.refc .rh div{display:flex;flex-direction:column;line-height:1.4}
.refc .rh b{font-size:17px}
.refc .rh span{font-size:12.5px;color:var(--muted)}
.rrow{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--bg);border-radius:10px;padding:10px 12px}
.rrow .rl{font-size:14.5px;font-weight:600}
.rrow .rl small{display:block;font-weight:400;font-size:12px;color:var(--muted)}

     ["media/hm-2.jpg","تثبيت الإبرة في الوريد","دخول الإبرة بشكل جزئي أو غير مستقر في الوريد.","ثبّت الإبرة جيدًا داخل الوريد."],
     ["media/hm-3.jpg","قوة السحب","سحب الدم بقوة وبسرعة.","اسحب بهدوء ودون ضغط زائد."],
     ["media/hm-4.jpg","تفريغ الدم في الأنبوب","الضغط بقوة على المكبس عند تفريغ الدم في الأنبوب.","فرّغ الدم بهدوء ودون ضغط زائد."],
     ["media/hm-5.jpg","مزج الأنبوب","رج الأنبوب بعنف.","اقلب الأنبوب بلطف 5–8 مرات دون رج."],
     ["media/hm-6.jpg","الرباط الضاغط","ترك الرباط الضاغط لفترة طويلة.","فك الرباط خلال دقيقة واحدة."],
     ["media/hm-7.jpg","فصل المصل","تأخير فصل المصل أو إرسال العينة إلى المختبر.","افصل المصل في أقرب وقت ممكن، وأرسل العينة مباشرة."]
   ]},
   {t:"no",title:"أسباب أخرى يجب تجنبها",items:["عدم ترك المطهر (الكحول) يجف قبل السحب.","استخدام وريد صغير أو هش أو متصلب، أو تكرار إدخال الإبرة.","السحب من قسطرة وريدية (IV line) دون اتباع الإجراء الصحيح.","تعبئة الأنبوب بأقل أو أكثر من الحجم المطلوب.","استخدام أنابيب منتهية الصلاحية أو تالفة.","عدم اتباع ترتيب سحب الأنابيب (Order of Draw).","نقل العينة بعنف أو تعريضها لاهتزاز شديد أو لحرارة غير مناسبة."]},
   {t:"callout",text:"جودة العينة تبدأ من سحبها الصحيح."}
  ]},
 {id:"transport",cat:"hemo",icon:"box",tone:"",title:"ترتيب العينات في صندوق النقل",sub:"6 خطوات مصوّرة لنقل آمن يمنع الانحلال",kw:"نقل صندوق بوكس ثلج تبريد انحلال transport box cooler",credit:"المصدر: إدارة المختبرات وبنوك الدم – تجمع تبوك الصحي",
  blocks:[
   {t:"lead",text:"يسبب تكسّر كريات الدم الحمراء (Hemolysis) تغيّرًا في النتائج، وقد يؤدي إلى إعادة السحب وتأخير التشخيص والعلاج."},
   {t:"photosteps",items:[
     ["media/tb-1.jpg","الطريقة المثلى لوضع العينات",["ضع الأنابيب بشكل رأسي داخل حامل ثابت.","تأكد من إحكام غلق الأغطية جيدًا.","تجنب ملامسة الأنابيب لبعضها أو لجدران الصندوق.","امنع حركة الأنابيب أو ارتطامها أثناء النقل.","عند الحاجة للتبريد، ضع طبقة عازلة بين العينات والثلج."]],
     ["media/tb-2.jpg","منع الاهتزاز والصدمات","انقل العينات بهدوء، وتجنب رج الصندوق أو تعريضه للاهتزاز والصدمات."],
     ["media/tb-3.jpg","التبريد الصحيح","عند الحاجة إلى التبريد، ضع طبقة عازلة (قطن أو مادة ماصة) بين العينات وأكياس الثلج."],
     ["media/tb-4.jpg","تجنب ملامسة الثلج مباشرة","لا تضع الأنابيب مباشرة مع الثلج أو المجمّد، وتجنب تجميد العينات.",1],
     ["media/tb-5.jpg","درجة حرارة النقل المناسبة","ليست جميع عينات الدم تحتاج إلى التبريد، اتبع المتطلبات الخاصة بكل فحص."],
     ["media/tb-6.jpg","إغلاق صندوق النقل جيدًا","أغلق الصندوق بإحكام للحفاظ على درجة الحرارة ومنع الانسكاب أو التلوث."]
   ]},
   {t:"courier",logo:"media/spl-logo.png",name:"شركة سبل (SPL)",text:"الجهة المسؤولة عن نقل العينات من المراكز الصحية إلى المختبر المرجعي. سلّم الصندوق لمندوب سبل بعد ترتيب العينات وإغلاقه جيدًا."},
   {t:"okimg",img:"media/tb-rem.jpg",title:"تذكّر",items:["أنبوب عمودي داخل حامل ثابت.","إحكام الإغلاق.","طبقة عازلة مع الثلج.","نقل بهدوء ودون اهتزاز.","سلامة العينة = دقة النتائج."]}
  ]},
 {id:"acr",cat:"patient",icon:"cup",tone:"a",title:"أخذ عينة تحليل ACR",sub:"9 خطوات مصوّرة · الألبومين إلى الكرياتينين في البول",kw:"بول albumin creatinine ratio ACR كلى سكري ضغط عينتي سبل",credit:"إعداد: فهد بن إبراهيم",
  blocks:[
   {t:"lead",text:"يُستخدم تحليل <b>ACR</b> للكشف المبكر عن أمراض الكلى ومتابعتها لدى مرضى السكري وارتفاع ضغط الدم."},
   {t:"photosteps",items:[
     ["media/acr-1.jpg","اشرح الإجراء للمريض","وضّح له هدف التحليل وطريقة أخذ العينة."],
     ["media/acr-2.jpg","نوع العينة","عينة بول عشوائية، ويُفضّل أول بول صباحي."],
     ["media/acr-3.jpg","جهّز الأدوات",["كوب جمع بول معقّم.","ملصق بيانات (باركود).","طلب فحص ACR.","قفازات."]],
     ["media/acr-4.jpg","وجّه المريض",["يغسل يديه جيدًا.","ينظّف المنطقة التناسلية بماء نظيف.","يبدأ التبول في المرحاض، ثم يجمع العينة من منتصف التدفق في الكوب المعقّم."]],
     ["media/acr-5.jpg","كمية العينة","20–30 مل في الكوب المعقّم."],
     ["media/acr-6.jpg","أغلق الكوب بإحكام","تأكد من الإغلاق جيدًا لمنع التسرب."],
     ["media/acr-7.jpg","سجّل البيانات","الصق ملصق الباركود (الاسم ورقم الهوية) على الكوب بدقة."],
     ["media/acr-8.jpg","أرفق الباركود الإضافي","ضعه مع العينة في الكيس المعقّم الخاص بالعينات، وأغلقه جيدًا."],
     ["media/acr-9.jpg","سلّم العينة للشحن","تُسلّم لموظف شركة الشحن (سبل) لتوصيلها إلى المختبر المرجعي."]
   ]},
   {t:"warnimg",img:"media/acr-warn.jpg",title:"تنبيهات مهمة",items:["تجنب أخذ العينة بعد مجهود بدني شديد.","تجنب أخذ العينة أثناء الدورة الشهرية أو عند وجود دم في البول.","يُبلغ المريض الطبيب عن الأدوية التي قد تؤثر على النتيجة.","+أول بول صباحي يعطي نتيجة أدق.","+يشرب المريض كمية معتدلة من الماء قبل أخذ العينة."]}
  ]},
 {id:"fit",cat:"patient",icon:"stool",tone:"t",title:"فحص سلامة القولون والمستقيم",sub:"6 خطوات مصوّرة لأخذ عينة البراز وحفظها",kw:"براز قولون مستقيم FIT colon stool occult Hemosure",credit:"المصدر: نشرة كيت Hemosure Accu-Reader A100",
  blocks:[
   {t:"staff",text:"الرجاء شرح هذه الخطوات للمستفيد المراد عمل التحليل له."},
   {t:"photosteps",items:[
     ["media/fit-1.jpg","قبل البدء",["سجّل البيانات على الملصق الخارجي للأنبوب (الاسم ورقم الهوية).","فك الغطاء واسحب عود العينة إلى الخارج.","افتح الأنبوب بحذر حتى لا يُسكب السائل الموجود بداخله."],0,1],
     ["media/fit-2.jpg","طريقة أخذ العينة",["أدخل رأس العود في 6 أماكن مختلفة من عينة البراز.","تأكد أن الجزء الحلزوني في طرف العود مغطى بالعينة بالكامل.","لا تثنِ العود أثناء أخذ العينة."],0,1],
     ["media/fit-3.jpg","إغلاق الأنبوب وحفظ العينة",["أعد العود إلى الأنبوب، واضغط الغطاء حتى يُحكم الإغلاق.","رجّ الأنبوب برفق للأعلى والأسفل لمدة 10 ثوانٍ ليختلط البراز بالسائل.","ضع الأنبوب في الكيس البلاستيكي المرفق.","احفظ العينة في مكان بارد بعيدًا عن الحرارة والشمس حتى تسليمها للمختبر."],0,1],
     ["media/fit-hand.jpg","تسليم العينة للمركز الصحي","يُسلّم المستفيد العينة إلى موظف المختبر في المركز الصحي في أقرب وقت ممكن بعد أخذها."],
     ["media/fit-4.jpg","التحقق من البيانات","بعد استلام العينة من المستفيد، تأكد من معلومات المستفيد، ثم اطبع الباركود وألصقه على أنبوب التحليل الخاص."],
     ["media/fit-5.jpg","حفظ العينة في المختبر",["تُحفظ العينة في ثلاجة مختبر المركز الصحي بدرجة حرارة 2–8°C.","تُرسل إلى المختبر المرجعي خلال مدة لا تتجاوز 4 أيام."]]
   ]},
   {t:"info",title:"درجات الحرارة والتخزين",items:["<b>العينة بعد أخذها:</b> تُحفظ في ثلاجة مختبر المركز الصحي بدرجة حرارة 2–8°C، وتُرسل إلى المختبر المرجعي خلال 4 أيام كحد أقصى.","<b>الأنابيب غير المستخدمة:</b> تُحفظ في 4–30°C بعيدًا عن الضوء المباشر، وصلاحيتها 24 شهرًا. تحقق من تاريخ الانتهاء على العلبة قبل صرفها."]},
   {t:"warnimg",img:"media/fit-warn.jpg",title:"تحذيرات",items:["لا تثنِ العود، ولا تسكب السائل الموجود في الأنبوب.","لا تفتح الأنبوب مرة أخرى بعد إغلاقه.","للسيدات: لا تؤخذ العينة خلال فترة الحيض.","احفظ العينة بعيدًا عن متناول الأطفال."]}
  ]},
 {id:"centrifuge",cat:"equip",icon:"spin",tone:"",title:"دليل استخدام جهاز الطرد المركزي",sub:"التحضير والموازنة والتشغيل والإيقاف والسلامة",kw:"طرد مركزي سنترفيوج centrifuge فصل مصل بلازما موازنة rpm دوار",credit:"إعداد وتنسيق: فهد بن إبراهيم",
  blocks:[
   {t:"lead",text:"يشرح هذا الدليل خطوة بخطوة كيف يُشغَّل جهاز الطرد المركزي (السنترفيوج) بأمان لفصل عينات الدم في المراكز الصحية، من استلام العينة حتى تنظيف الجهاز."},
   {t:"info",title:"نظرة سريعة",items:["<b>نطاق الاستخدام:</b> عينات المصل والبلازما.","<b>سرعة الدوران:</b> 3500–5000 RPM.","<b>زمن الفصل:</b> 5 دقائق كحد أقصى."]},
   {t:"info",title:"الهدف والفئة المستهدفة",items:["<b>الفئة المستهدفة:</b> فنيو وأخصائيو المختبر والتمريض، وكل من يتعامل مع العينات في المركز الصحي.","<b>الهدف:</b> الحصول على مصل أو بلازما صالحة للتحليل، ومنع تكسّر الأنابيب وتلف الجهاز وإصابة العاملين.","<b>المرجع:</b> دليل الشركة المصنّعة للجهاز وسياسة المختبر المرجعي، وعند أي تعارض تُتّبع تعليمات المصنّع."]},
   {t:"photosteps",tag:"",items:[
     ["media/cf-dev.jpg","أجزاء الجهاز",["<b>الغطاء (الباب):</b> يغلق حجرة الدوران، ولا يعمل الجهاز إلا وهو مغلق ومقفل.","<b>الدوّار (Rotor):</b> القرص الذي يحمل الأنابيب ويدور بها.","<b>الجيوب (الحواضن):</b> فتحات مرقّمة توضع فيها الأنابيب.","<b>لوحة التحكم:</b> ضبط السرعة (RPM) والوقت، وزر التشغيل (START) والإيقاف (STOP).","<b>الشاشة:</b> تعرض السرعة والوقت المتبقي ورسائل الخطأ.","<b>مفتاح الطاقة:</b> تشغيل الجهاز وإطفاؤه."]]
   ]},
   {t:"steps",title:"العينات والأنابيب التي تُفصل",items:[
     ["جيل فاصل (SST) · غطاء أصفر / ذهبي",["الناتج: مصل (Serum).","القسم: الكيمياء الحيوية، والهرمونات، والفيروسات.","قبل الفصل: يُترك حتى يكتمل التجلط."]],
     ["بدون مانع تجلط · غطاء أحمر",["الناتج: مصل (Serum).","القسم: حسب الدليل.","قبل الفصل: يُترك حتى يكتمل التجلط."]],
     ["هيبارين · غطاء أخضر",["الناتج: بلازما.","القسم: حسب الدليل.","قبل الفصل: يُقلب بلطف ويُفصل مباشرة."]],
     ["سيترات · غطاء أزرق فاتح",["الناتج: بلازما.","القسم: التخثر.","قبل الفصل: يُملأ حتى الخط المحدد تمامًا."]]
   ]},
   {t:"warn",title:"تنبيه",items:["أنبوب EDTA (البنفسجي) لفحص صورة الدم الكاملة لا يُفصل.","لا تُفصل إلا العينات المطلوب فصلها حسب دليل الفحوصات."]},
   {t:"steps",title:"التحضير قبل التشغيل",items:[
     ["الوقاية الشخصية","ارتدِ القفازين والمريول قبل لمس العينات أو الجهاز."],
     ["مكان الجهاز","تأكد أن الجهاز على سطح مستوٍ وثابت، بعيد عن حافة الطاولة، وحوله مسافة تهوية كافية."],
     ["حجرة الدوران","افحصها: نظيفة وجافة وخالية من بقايا الزجاج أو السوائل."],
     ["بيانات العينة","تحقق من بيانات الملصق على كل أنبوب ومطابقتها لطلب الفحص."],
     ["سلامة الأنابيب","افحص الأنابيب: لا شقوق، والغطاء محكم الإغلاق."],
     ["اكتمال التجلط","أنابيب المصل (الأصفر والأحمر): اتركها قائمة 15–30 دقيقة حتى يكتمل التجلط قبل الفصل."]
   ]},
   {t:"photosteps",tag:"",items:[
     ["media/cf-bal.jpg","موازنة الجهاز: أهم خطوة","كل أنبوب يجب أن يقابله أنبوب <b>بنفس الحجم والنوع ومستوى التعبئة</b> في الجيب المقابل له تمامًا عبر المركز. الجهاز غير المتوازن يهتز بقوة، وقد يكسر الأنابيب أو يتلف الدوّار."],
     ["media/cf-bal1.jpg","توزيع الأنابيب",["ضع الأنبوب الأول في أي جيب، ثم ضع الثاني في الجيب المقابل له مباشرة (مثلًا 1 مقابل 7 في دوّار من 12 جيبًا).","مع 3 أنابيب يمكن توزيعها على شكل مثلث متساوي الأضلاع (مثلًا الجيوب 1 و5 و9)."]],
     ["media/cf-bal2.jpg","أنبوب الموازنة",["إذا كان عدد العينات فرديًا (عينة واحدة مثلًا): أضف أنبوب موازنة مملوءًا بالماء، بنفس الحجم والنوع، في الجيب المقابل.","راجع التوزيع بالنظر قبل إغلاق الغطاء."]]
   ]},
   {t:"steps",title:"خطوات التشغيل",items:[
     ["تشغيل الجهاز","شغّل الجهاز من مفتاح الطاقة وانتظر ظهور الشاشة."],
     ["وضع الأنابيب","افتح الغطاء وضع الأنابيب في الجيوب بشكل متوازن، والأغطية للأعلى."],
     ["إغلاق الغطاء","أغلق الغطاء بإحكام حتى تسمع صوت القفل."],
     ["ضبط السرعة","اضبط السرعة على القيمة المعتمدة لجهازك ضمن 3500–5000 RPM."],
     ["ضبط الوقت","اضبط الوقت على <b>5 دقائق كحد أقصى</b>."],
     ["بدء الدوران","اضغط زر التشغيل <b>START</b>."],
     ["المراقبة","ابقَ قرب الجهاز في أول دقيقة: إذا سمعت صوتًا غير طبيعي أو شعرت باهتزاز قوي اضغط <b>STOP</b> فورًا."],
     ["أثناء الدوران","لا تفتح الغطاء ولا تحرك الجهاز أثناء الدوران."]
   ]},
   {t:"info",title:"سرعة الدوران ومدة الفصل",items:["<b>سرعة الدوران:</b> 3500–5000 RPM حسب موديل الجهاز والدوّار والأنبوب.","<b>مدة الفصل:</b> 5 دقائق كحد أقصى.","<b>مدة التجلط قبل الفصل (أنابيب المصل):</b> 15–30 دقيقة."]},
   {t:"callout",text:"تُثبَّت القيمة المعتمدة لكل جهاز على ملصق بجانبه، ولا تُغيَّر إلا بقرار من إدارة المختبرات."},
   {t:"steps",title:"الإيقاف وإخراج العينات",items:[
     ["انتظار التوقف","انتظر انتهاء البرنامج وتوقّف الدوّار تمامًا قبل فتح الغطاء."],
     ["إخراج الأنابيب","افتح الغطاء وأخرج الأنابيب بحذر وهي في وضع رأسي، دون رج."],
     ["جودة الفصل","تأكد من جودة الفصل: طبقة مصل أو بلازما صافية فوق الجل أو الخلايا، دون تحلل دموي (لون أحمر) أو تجلط ظاهر."],
     ["التجهيز للنقل","ضع العينات في الحامل وجهّزها حسب اشتراطات النقل والحفظ."],
     ["إطفاء الجهاز","أطفئ الجهاز ونظّفه وفق التعليمات، واترك الغطاء مفتوحًا قليلًا ليجف."]
   ]},
   {t:"no",title:"تعليمات السلامة",items:["يُمنع تشغيل الجهاز دون موازنة، أو بأنابيب مكسورة أو مشروخة أو غير محكمة الإغلاق.","يُمنع تجاوز السرعة أو الزمن المعتمدين.","يُمنع فتح الغطاء أثناء الدوران أو محاولة إيقاف الدوّار باليد.","تُفصل العينات خلال ساعتين من السحب، ووفق دليل كل فحص.","ارتدِ القفازين دائمًا، واعتبر كل عينة معدية."]},
   {t:"warn",title:"عند كسر أنبوب أو انسكاب داخل الجهاز",items:["أوقف الجهاز واتركه مغلقًا <b>30 دقيقة</b> لتهدأ الرذاذات.","ارتدِ القفازين، والتقط الزجاج بملقط (لا باليد) وضعه في حاوية الأدوات الحادة.","نظّف الحجرة والجيوب بمطهر معتمد وفق تعليمات الشركة.","أبلغ مسؤول المختبر وسجّل الحادثة، وأعد سحب العينة إذا لزم."]},

const st={sq:"",scat:"all",scol:"",tab:"guides",guide:null,q:"",test:"hba1c",afSec:"tests",errQ:"",dir:"mm2mg",vals:{chol:"",trig:"",ldl:"",hdl:""}};
const $=s=>document.querySelector(s);
const norm=s=>String(s).toLowerCase().replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/[ً-ْ]/g,"");

function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2000);}

const TABS=[{id:"guides",name:"الأدلة",ic:"book"},{id:"afinion",name:"Afinion 2",ic:"device"},{id:"convert",name:"تحويل الدهون",ic:"swap"}];
function nav(){
  $("#tabs").innerHTML=TABS.map(t=>`<button class="tab" type="button" data-tab="${t.id}" ${st.tab===t.id?'aria-current="page"':''}><span class="p">${svg(t.ic)}</span>${t.name}</button>`).join("");
  $("#tabs").querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{st.tab=b.dataset.tab;st.guide=null;draw(true);});
}
function header(){
  const g=st.guide&&GUIDES.find(x=>x.id===st.guide);
  const titles={guides:"دليل المختبرات وعينتي في المراكز الصحية",afinion:"جهاز Abbott Afinion 2",supply:"أكواد التموين الطبي",convert:"تحويل وحدات الدهون"};
  $("#top").innerHTML=g
    ? `<button class="back" type="button" id="back" aria-label="رجوع">${svg("back",22,2.2)}</button><div class="tt"><small>${CATS.find(c=>c.id===g.cat).name}</small><b>${g.title}</b></div><img class="minilogo" src="media/logo-white.png" alt="شعار تجمع تبوك الصحي">`
    : `<div class="brandhead"><img class="wlogo" src="media/logo-white.png" alt="شعار تجمع تبوك الصحي"><small>تجمع تبوك الصحي</small><b>${titles[st.tab]}</b></div>`;
  $("#top").classList.toggle("center",!g);
  const b=$("#back"); if(b) b.onclick=()=>{st.guide=null;draw(true);};
}
function draw(top){
  nav(); header();
  const v=$("#view");
  if(st.guide==="supplylist") v.innerHTML=supplyPage();
  else if(st.guide) v.innerHTML=guidePage(GUIDES.find(x=>x.id===st.guide));
  else if(st.tab==="guides") v.innerHTML=listPage();
  else if(st.tab==="afinion") v.innerHTML=afinionPage();
  else v.innerHTML=convertPage();
  bind(); if(st.guide==="supplylist"){supBind();const q=$("#sq");if(q)q.oninput=()=>{st.sq=q.value;supRefresh(false);};} if(top) window.scrollTo(0,0);
}

/* ---------- guides list ---------- */
function listPage(){
  return `<div class="page">
    <div><h1>الأدلة الإرشادية</h1></div>
    <p class="sub">دليل مختصر لكل إجراء. اختر الدليل لعرضه.</p>
    <div id="glist" style="display:flex;flex-direction:column;gap:16px">${listRows()}</div>
    ${installCard()}
    <p class="credit-by">تصميم وإنشاء: <b>فهد بن إبراهيم</b><small>مشرف عينتي والمختبر بإدارة المراكز الصحية</small></p>
  </div>`;
}
function listRows(){
  const q=norm(st.q.trim()); let out="";
  for(const c of CATS){
    const items=GUIDES.filter(g=>g.cat===c.id&&(!q||norm(g.title+" "+g.sub+" "+g.kw).includes(q)));
    if(!items.length) continue;
    out+=`<div class="group"><div class="glabel">${c.name}</div>${items.map(g=>`<button class="row" type="button" data-g="${g.id}"><span class="ic ${g.tone}">${svg(g.icon)}</span><span class="tx"><b>${g.title}</b><span>${g.sub}</span></span><span class="chev">${svg("chev",20)}</span></button>`).join("")}</div>`;
  }
  return out||`<div class="empty">لا توجد أدلة تطابق «${esc(st.q)}». جرّب كلمة أخرى.</div>`;
}

function errRows(){
  const q=st.errQ.trim(); let out="";
  for(const grp of ERRS){
    const items=grp.items.filter(e=>!q||e[0].split(" ").some(c=>c.startsWith(q))||norm(JSON.stringify(e)).includes(norm(q)));
    if(!items.length) continue;
    out+=`<section class="card"><h3>${grp.g}</h3><div>${items.map(e=>{
      const long=!/^[0-9 ]+$/.test(e[0])||e[0].length>4;
      const body=Array.isArray(e[1])
        ? e[1].map(([c,a])=>`<p class="why">${N(c)}</p><p>${N(a)}</p>`).join("")
        : `<b>${N(e[1])}</b><p>${N(e[2])}</p>`;
      return `<div class="err"><span class="c ${long?'long':''}">${e[0].replace(/ /g,"<br>")}</span><div>${Array.isArray(e[1])?`<b>أكثر من سبب محتمل</b>`:""}${body}</div></div>`;}).join("")}</div></section>`;
  }
  return out||`<div class="empty">لا يوجد رمز بهذا الرقم. تأكد من الرقم الظاهر على شاشة الجهاز.</div>`;
}

/* ---------- converter ---------- */
const fmt=(n,d)=>isFinite(n)?String(+n.toFixed(d)):"";
const toNum=v=>parseFloat(String(v).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[٫,]/g,"."));
function units(){return st.dir==="mm2mg"?["mmol/L","mg/dL"]:["mg/dL","mmol/L"];}
function convOne(l,raw){
  const n=toNum(raw); if(String(raw).trim()===""||isNaN(n)) return {out:"",mm:null};
  return st.dir==="mm2mg"?{out:fmt(n*l.f,0),mm:n}:{out:fmt(n/l.f,2),mm:n/l.f};
}
function statusHTML(l,mm){
  const range=`<span class="ltr">${l.lo}–${l.hi} mmol/L</span> · <span class="ltr">${Math.round(l.lo*l.f)}–${Math.round(l.hi*l.f)} mg/dL</span>`;
  if(mm==null) return `<div class="status none">المعدل الطبيعي: ${range}</div>`;
  if(mm<l.lo) return `<div class="status lo">${svg("info",18)}أقل من المعدل الطبيعي</div>`;
  if(mm>l.hi) return `<div class="status hi">${svg("alert",18)}أعلى من المعدل الطبيعي</div>`;
  return `<div class="status in">${svg("check",18,2.4)}ضمن المعدل الطبيعي</div>`;
}
function lipCard(l){
  const [from,to]=units(); const r=convOne(l,st.vals[l.id]);
  return `<section class="card lipcard" data-l="${l.id}">
    <h3>${l.name} <span class="ltr" style="font-weight:600;color:var(--brand);font-size:14px">${l.short}</span></h3>
    <div class="pair">
      <div class="fld"><label for="in-${l.id}">${from}</label><input id="in-${l.id}" data-in="${l.id}" inputmode="decimal" autocomplete="off" placeholder="أدخل القيمة" value="${esc(st.vals[l.id])}"></div>
      <div class="eq" aria-hidden="true">←</div>
      <div class="fld"><label>${to}</label><output class="res" id="out-${l.id}" aria-live="polite">${r.out||"—"}</output></div>
    </div>
    <div id="st-${l.id}">${statusHTML(l,r.mm)}</div>
  </section>`;
}

const SCATS=[["all","الكل"],["tubes","انابيب سحب الدم"],["draw","أدوات سحب الدم"],["lab","مستلزمات المختبر"]];
const isTube=o=>o.cat==="draw"&&o.ar.startsWith("انبوب");
const SCOLS=[["purple","بنفسجي","#8E5BD4"],["pink","وردي","#F09CC0"],["yellow","أصفر","#F2C024"],["red","أحمر","#D83A34"],["orange","برتقالي","#EE8A2A"],["lgreen","أخضر فاتح","#8DD06A"],["green","أخضر","#2E9E57"],["lblue","أزرق فاتح","#68B4E8"],["gray","رمادي","#8E9599"],["black","أسود","#2A2A2A"],["royal","أزرق ملكي","#2450B8"]];
const snorm=s=>norm(s).replace(/[ؤ]/g,"و").replace(/[ئ]/g,"ي").replace(/ـ/g,"").replace(/[()،,؛]/g," ");
SUPPLY.forEach(o=>{o.h=" "+snorm([o.ar,o.en,o.kw,(o.tr||[]).map(t=>t[1]).join(" "),(SCATS.find(c=>c[0]===o.cat)||[])[1],(SCOLS.find(c=>c[0]===o.c)||[])[1]||""].join(" "))+" ";o.k=[o.nup,o.new,o.old,o.moh||"",...(o.tr||[]).map(t=>t[0])].join(" ");});
const tokHit=(o,t)=>{if(/^\d+$/.test(t)){if(t.length>=5&&o.k.includes(t))return true;return new RegExp("(^|[^0-9.])"+t+"([^0-9.]|$)").test(o.h);}return o.h.includes(t);};
function supMatch(){
  const toks=snorm(st.sq).split(/\s+/).filter(Boolean);
  return SUPPLY.filter(o=>(st.scat==="all"||(st.scat==="tubes"?isTube(o):(!isTube(o)&&o.cat===st.scat)))&&toks.every(t=>tokHit(o,t)));
}
function supCode(l,v){return v?`<button type="button" class="scp" data-sc="${v}" aria-label="نسخ كود ${l}"><span>${l}</span><b>${v}</b>${svg("copy",15,2)}</button>`:`<span class="scp none"><span>${l}</span><b>لا يوجد</b></span>`;}
function supRows(){
  const r=supMatch();
  if(!r.length) return `<div class="empty">لا توجد بنود تطابق بحثك. جرّب كلمة أخرى أو امسح الفلتر.</div>`;
  let last="";
  return r.map(o=>{const gk=isTube(o)?"tubes":o.cat;const g=gk!==last?(last=gk,`<div class="sgl">${SCATS.find(c=>c[0]===gk)[1]}</div>`):"";return g+`<article class="sup"><img src="media/sup/${o.n}.jpg?v=20261109" alt="" loading="lazy" width="60" height="60"><div class="sx"><b>${N(o.ar)}</b><span class="sen">${o.en}</span><div class="scs">${o.nup?supCode("NUPCO",o.nup):""}${o.only?(o.moh?supCode("MOH",o.moh):""):o.moh?supCode("MOH",o.moh):supCode("NEW MOH",o.new)+supCode("OLD MOH",o.old)}</div>${o.tr?`<details class="str"><summary>الأكواد التجارية (${o.tr.length})</summary>${o.tr.map(t=>`<div class="trr">${supCode("Trade",t[0])}<small>${t[1]}</small></div>`).join("")}</details>`:""}${o.note?`<p class="snote">${svg("alert",15)}${o.note}</p>`:""}</div></article>`;}).join("");
}
function supCount(){const n=supMatch().length,tot=SUPPLY.length;return n===tot?`${n} بندًا`:`${n} من ${tot} بندًا`;}
function supChips(){
  return `<div class="schips" role="group" aria-label="التصنيف">${SCATS.map(c=>`<button type="button" data-scat="${c[0]}" aria-pressed="${st.scat===c[0]}">${c[1]}</button>`).join("")}</div>`;
}
function supplyPage(){
  return `<div class="page">
    <div><h1>أكواد المستلزمات الطبية</h1></div>
    <p class="sub">ابحث باسم الصنف أو رقم الكود، واضغط على الكود لنسخه.</p>
    <div class="ssticky"><label class="search" for="sq">${svg("search",20)}<span hidden>ابحث في البنود</span><input id="sq" type="search" placeholder="مثال: EDTA 4 مل، أصفر، فراشة، 7878…" value="${esc(st.sq)}" autocomplete="off"></label>
    <div id="schipsw">${supChips()}</div></div>
    <p class="scount" id="scount">${supCount()}</p>
    <div id="slist" class="slist">${supRows()}</div>
    <p class="credit">المصدر: قائمة بنود مستلزمات المراكز الصحية · NUPCO | NEW MOH | OLD MOH</p>
  </div>`;
}
function supRefresh(chips){$("#slist").innerHTML=supRows();$("#scount").textContent=supCount();if(chips){$("#schipsw").innerHTML=supChips();}supBind();}
function supBind(){
  const v=$("#view"); const ss=v.querySelector(".ssticky"),tp=$("#top"); if(ss&&tp) ss.style.top=(tp.getBoundingClientRect().height)+"px";
  v.querySelectorAll("[data-scat]").forEach(b=>b.onclick=()=>{st.scat=b.dataset.scat;if(st.scat!=="all"&&st.scat!=="draw")st.scol="";supRefresh(true);});
  v.querySelectorAll("[data-scol]").forEach(b=>b.onclick=()=>{st.scol=st.scol===b.dataset.scol?"":b.dataset.scol;if(st.scol&&st.scat!=="draw"&&st.scat!=="all")st.scat="all";supRefresh(true);});
  v.querySelectorAll("[data-sc]").forEach(b=>b.onclick=async()=>{
    try{await navigator.clipboard.writeText(b.dataset.sc);toast("تم نسخ الكود "+b.dataset.sc);}
    catch(e){const r=document.createRange();r.selectNodeContents(b.querySelector("b"));const s=getSelection();s.removeAllRanges();s.addRange(r);toast("الكود محدد، انسخه يدويًا");}
  });
}
/* ---------- binding ---------- */
function bind(){
  const v=$("#view");
  v.querySelectorAll("[data-img]").forEach(b=>b.onclick=()=>{$("#vimg").src=b.dataset.img;$("#vimg").alt=b.dataset.title;$("#vtt").textContent=b.dataset.title;$("#viewer").hidden=false;document.body.style.overflow="hidden";$("#vclose").focus();});
  v.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{st.guide=b.dataset.g;draw(true);});
  v.querySelectorAll("[data-to]").forEach(b=>b.onclick=()=>{st.tab=b.dataset.to;st.guide=null;draw(true);});
  v.querySelectorAll("[data-sec]").forEach(b=>b.onclick=()=>{st.afSec=b.dataset.sec;draw(false);});
  v.querySelectorAll("[data-test]").forEach(b=>b.onclick=()=>{st.test=b.dataset.test;draw(false);});
  const eq=$("#eq"); if(eq) eq.oninput=()=>{st.errQ=eq.value;$("#errlist").innerHTML=errRows();};
  v.querySelectorAll("[data-copy]").forEach(b=>b.onclick=async()=>{
    try{await navigator.clipboard.writeText(b.dataset.copy);toast("تم نسخ الكود");}
    catch(e){const r=document.createRange();r.selectNodeContents(b.previousElementSibling.querySelector("b"));const s=getSelection();s.removeAllRanges();s.addRange(r);toast("الكود محدد، انسخه يدويًا");}
  });
  v.querySelectorAll("[data-dir]").forEach(b=>b.onclick=()=>{
    if(st.dir===b.dataset.dir) return;
    for(const l of LIPIDS){const r=convOne(l,st.vals[l.id]); st.vals[l.id]=r.out;}
    st.dir=b.dataset.dir; draw(false);});
  v.querySelectorAll("[data-in]").forEach(inp=>inp.oninput=()=>{
    const l=LIPIDS.find(x=>x.id===inp.dataset.in); st.vals[l.id]=inp.value; const r=convOne(l,inp.value);
    $("#out-"+l.id).textContent=r.out||"—"; $("#st-"+l.id).innerHTML=statusHTML(l,r.mm);});
  const ca=$("#clearall"); if(ca) ca.onclick=()=>{for(const l of LIPIDS) st.vals[l.id]=""; draw(false); $("#in-chol").focus();};
}

function closeViewer(){$("#viewer").hidden=true;document.body.style.overflow="";}
$("#vclose").onclick=closeViewer;
$("#viewer").addEventListener("keydown",e=>{if(e.key==="Escape")closeViewer();});
/* ---------- install (add to home screen) ---------- */
let deferredPrompt=null;
const isStandalone=()=>{try{return matchMedia("(display-mode: standalone)").matches||navigator.standalone===true}catch(e){return false}};
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
function installCard(){
  if(isStandalone()) return "";
  return `<section class="card install" ${deferredPrompt?"":"hidden"}><div class="ins-row"><img src="media/logo-white.png" alt="" class="ins-ic"><div class="ins-tx"><b>ثبّت التطبيق على جهازك</b><span>أيقونة بشعار التجمع على الشاشة الرئيسية أو سطح المكتب</span></div></div><button type="button" class="ins-btn" id="insBtn">${svg("down",18,2.2)}تثبيت التطبيق</button></section>`;
}
function bindInstall(){
  const b=$("#insBtn"); if(!b) return;
  b.onclick=async()=>{
    if(!deferredPrompt) return;
    deferredPrompt.prompt();
    try{await deferredPrompt.userChoice}catch(e){}
    deferredPrompt=null; const c=document.querySelector(".install"); if(c) c.hidden=true;
  };
}
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;const c=document.querySelector(".install");if(c)c.hidden=false;});
window.addEventListener("appinstalled",()=>{deferredPrompt=null;const c=document.querySelector(".install");if(c)c.remove();});
try{if("serviceWorker" in navigator&&location.protocol==="https:"&&!/claude/.test(location.hostname))navigator.serviceWorker.register("sw.js").catch(()=>{});}catch(e){}
new MutationObserver(()=>bindInstall()).observe(document.getElementById("view"),{childList:true});
/* ---------- boot ---------- */
(function(){
  const h=location.hash.slice(1);
  if(TABS.some(t=>t.id===h)) st.tab=h;
  else if(GUIDES.some(g=>g.id===h)) st.guide=h;
  draw(false);
})();
</script>
